<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Launch-readiness board" description="A checklist you and Claude build, check off, and ship — the Helm module-one widget." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="max-width:560px;margin:24px auto;padding:0 16px;font-family:var(--font-sans)">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);overflow:hidden">
    <div style="display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)">
      <span style="font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-0.02em;color:var(--text-strong)">Helm<span style="color:var(--primary)">.</span></span>
      <span style="width:1px;height:18px;background:var(--border-strong)"></span>
      <span style="font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--text-strong)">Launch readiness</span>
    </div>
    <div style="padding:18px 18px 6px">
      <x-import component-from-global-scope="HelmDesignSystem_94b187.ProgressBar" label="Launch readiness" value="{{ doneCount }}" max="{{ totalCount }}" size="lg" hint-size="100%,46px"></x-import>
    </div>
    <div style="padding:6px 14px;display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ tasks }}" as="task" hint-placeholder-count="4">
        <x-import component-from-global-scope="HelmDesignSystem_94b187.ChecklistItem" title="{{ task.title }}" status="{{ task.status }}" done="{{ task.done }}" on-toggle="{{ task.onToggle }}" on-delete="{{ task.onDelete }}" hint-size="100%,58px"></x-import>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--border);background:var(--surface-sunken)">
      <span style="font-size:13px;color:var(--text-muted);font-weight:500">{{ footerText }}</span>
      <x-import component-from-global-scope="HelmDesignSystem_94b187.Button" icon-left="rocket" disabled="{{ notReady }}" hint-size="118px,40px">{{ shipLabel }}</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:560}}">
class Component extends DCLogic {
  state = {
    tasks: [
      { id: 1, title: 'Provision Postgres + run schema migrations', status: 'done', done: true },
      { id: 2, title: 'Wire MCP tools → widget render bridge', status: 'active', done: false },
      { id: 3, title: 'Add OAuth + per-user boards', status: 'active', done: false },
      { id: 4, title: 'Handle optimistic check / reorder writes', status: 'blocked', done: false },
      { id: 5, title: 'Ship the self-host Docker image', status: 'todo', done: false },
    ],
  };

  renderVals() {
    const tasks = this.state.tasks;
    const done = tasks.filter((t) => t.done).length;
    const total = tasks.length;
    const complete = total > 0 && done === total;
    return {
      doneCount: done,
      totalCount: total,
      notReady: !complete,
      footerText: complete ? 'All tasks complete — go for launch.' : `${total - done} to go before launch`,
      shipLabel: complete ? 'Ship it' : 'Not ready',
      tasks: tasks.map((t) => ({
        ...t,
        onToggle: () => this.setState((s) => ({
          tasks: s.tasks.map((x) => x.id === t.id
            ? { ...x, done: !x.done, status: !x.done ? 'done' : (x.status === 'done' ? 'active' : x.status) }
            : x),
        })),
        onDelete: () => this.setState((s) => ({ tasks: s.tasks.filter((x) => x.id !== t.id) })),
      })),
    };
  }
}
</script>
</body>
</html>
