<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body{margin:0;background:var(--canvas);color:var(--text-body);padding:22px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);width:100%;margin-bottom:-4px}

<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.HelmDesignSystem_94b187;
function Demo() {
  return (
    <>
      <div className="row">
        <Button iconLeft="plus">Add task</Button>
        <Button variant="secondary">Edit board</Button>
        <Button variant="ghost" iconRight="chevron-down">Filter</Button>
        <Button variant="tinted" iconLeft="flag">Mark ready</Button>

      <div className="row">
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
        <Button loading>Saving…</Button>
        <Button disabled>Disabled</Button>
      </div>
      <div className="row">
        <IconButton icon="pencil" label="Edit" variant="secondary" />
        <IconButton icon="grip-vertical" label="Reorder" />
        <IconButton icon="check" label="Complete" variant="primary" />
        <IconButton icon="flag" label="Flag" variant="tinted" />
        <IconButton icon="trash" label="Delete" variant="danger" />
        <IconButton icon="plus" label="Add" variant="primary" round />
      </div>
    </>
  );
