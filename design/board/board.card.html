<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans)}
.head{margin-bottom:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { ChecklistItem, ProgressBar } = window.HelmDesignSystem_94b187;
function App(){
  const [tasks,setTasks] = React.useState([
    { id:1, title:'Provision Postgres + run migrations', status:'done', done:true },
    { id:2, title:'Wire up MCP tools → widget bridge', status:'active' },
    { id:3, title:'Add auth + per-user boards', status:'blocked' },
    { id:4, title:'Ship staging deploy', status:'todo' },
  ]);
  const done = tasks.filter((t)=>t.done).length;
  const toggle = (id) => setTasks((ts)=>ts.map((t)=>t.id===id?{...t,done:!t.done}:t));
  return (
    <div>
      <div className="head">
        <ProgressBar label="Launch readiness" value={done} max={tasks.length} valueFormat={(v,m)=>`${v} / ${m}`} />
      </div>
      {tasks.map((t)=>(
        <ChecklistItem key={t.id} title={t.title} status={t.status} done={t.done}
          onToggle={()=>toggle(t.id)} onEdit={()=>{}} onDelete={()=>{}}
          meta={t.status==='active' && !t.done ? <span className="helm-item__meta-item">Claude · due Fri</span> : null} />
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
