<!-- @dsCard group="Type" viewport="700x230" name="Display — Space Grotesk" subtitle="Assured, geometric headings that do real work" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-display)}
.big{font-size:46px;font-weight:700;letter-spacing:-.025em;line-height:1.02;color:var(--text-strong)}
.weights{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.w{color:var(--text-strong)}
.w span{display:block;font-size:24px}
.w small{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);font-weight:400}
.meta{margin-top:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--text-muted)}
</style></head><body>
<div class="big">Make progress<br>feel inevitable.</div>
<div class="weights">
<div class="w"><span style="font-weight:400">Aa</span><small>Regular 400</small></div>
<div class="w"><span style="font-weight:500">Aa</span><small>Medium 500</small></div>
<div class="w"><span style="font-weight:600">Aa</span><small>Semibold 600</small></div>
<div class="w"><span style="font-weight:700">Aa</span><small>Bold 700</small></div>
</div>
<div class="meta">Space Grotesk · headings, numerals, hero statements · tracking −0.02em</div>
</body></html>
