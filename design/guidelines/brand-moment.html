<!-- @dsCard group="Brand" viewport="700x240" name="The completed moment" subtitle="Where the brand lives — progress hits 100% and lights up" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--canvas);padding:20px;font-family:var(--font-sans);display:flex;justify-content:center}
.card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--primary-border);border-radius:var(--radius-xl);box-shadow:var(--glow-complete);padding:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.badge{width:44px;height:44px;border-radius:var(--radius-md);background:var(--gradient-brand);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 18px var(--glow-primary)}
.badge svg{width:24px;height:24px}
.h{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--text-strong);line-height:1.05}
.sub{font-family:var(--font-mono);font-size:12px;color:var(--primary-text);margin-top:3px;letter-spacing:.02em}
</style></head><body>
<div class="card">
<div class="top">
<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></span>
<div><div class="h">Ready to launch</div><div class="sub">All 10 tasks complete · shipped 2m ago</div></div>
</div>
<div class="helm-progress helm-progress--complete"><div class="helm-progress__head"><span class="helm-progress__label">Launch readiness</span><span class="helm-progress__value">100%</span></div><div class="helm-progress__track"><div class="helm-progress__fill" style="width:100%"></div></div></div>
</div>
</body></html>
