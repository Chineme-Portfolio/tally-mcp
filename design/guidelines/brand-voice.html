<!-- @dsCard group="Brand" viewport="700x250" name="Voice — decisive, operator" subtitle="Confident and energetic; never gamified or hollow" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans)}
.head{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--text-strong);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.col h4{margin:0 0 10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.col.say h4{color:var(--primary-text)}
.col.not h4{color:var(--text-faint)}
.line{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin-bottom:9px;line-height:1.4}
.say .line{color:var(--text-strong)}
.not .line{color:var(--text-faint)}
.g{color:var(--primary-text);font-weight:700;flex:none}
.x{color:var(--text-faint);flex:none}
</style></head><body>
<div class="head">Say what happens next, in the fewest confident words.</div>
<div class="grid">
<div class="col say"><h4>We write</h4>
<div class="line"><span class="g">✓</span>Mark ready</div>
<div class="line"><span class="g">✓</span>3 to go before launch.</div>
<div class="line"><span class="g">✓</span>Nothing here yet — add the first task and let's get moving.</div>
<div class="line"><span class="g">✓</span>Shipped. Board's green.</div>
</div>
<div class="col not"><h4>Not</h4>
<div class="line"><span class="x">✕</span>Submit</div>
<div class="line"><span class="x">✕</span>You currently have 3 incomplete items.</div>
<div class="line"><span class="x">✕</span>No data available.</div>
<div class="line"><span class="x">✕</span>Congratulations!! 🎉 You did it!!!</div>
</div>
</div>
</body></html>
