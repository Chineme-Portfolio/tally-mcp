<!-- @dsCard group="Colors" viewport="700x180" name="Signature — Helm Copper" subtitle="One saturated hue carries action, progress, and the completed moment" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:20px;font-family:var(--font-sans)}
.ramp{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.sw{flex:1;height:74px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
.sw b{font-family:var(--font-mono);font-size:11px;font-weight:600}
.legend{display:flex;gap:18px;margin-top:13px;flex-wrap:wrap}
.item{font-size:12px;color:var(--text-muted)}
.item b{color:var(--text-strong);font-weight:600}
.item code{font-family:var(--font-mono);font-size:11px;color:var(--primary-text)}
</style></head><body>
<div class="ramp">
<div class="sw" style="background:var(--copper-50)"><b style="color:#6e351f">50</b></div>
<div class="sw" style="background:var(--copper-100)"><b style="color:#6e351f">100</b></div>
<div class="sw" style="background:var(--copper-200)"><b style="color:#6e351f">200</b></div>
<div class="sw" style="background:var(--copper-300)"><b style="color:#4e2416">300</b></div>
<div class="sw" style="background:var(--copper-400)"><b style="color:#2e1408">400</b></div>
<div class="sw" style="background:var(--copper-500)"><b style="color:#2e1408">500</b></div>
<div class="sw" style="background:var(--copper-600)"><b style="color:#fff">600</b></div>
<div class="sw" style="background:var(--copper-700)"><b style="color:#fff">700</b></div>
<div class="sw" style="background:var(--copper-800)"><b style="color:#fff">800</b></div>
<div class="sw" style="background:var(--copper-900)"><b style="color:#fff">900</b></div>
</div>
<div class="legend">
<span class="item"><b>600</b> primary action <code>#b85c3e</code></span>
<span class="item"><b>400</b> dark-mode primary <code>#e08a63</code></span>
<span class="item"><b>50</b> completed tint</span>
<span class="item"><b>700</b> hover / accent text</span>
</div>
</body></html>
