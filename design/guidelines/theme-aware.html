<!-- @dsCard group="Colors" viewport="700x250" name="Theme-aware — light & dark" subtitle="The same board reads with AA contrast in both host themes" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--ink-100);padding:16px;font-family:var(--font-sans)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{border-radius:var(--radius-lg);padding:15px;background:var(--canvas);border:1px solid var(--border)}
.tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.tag .d{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.stack{display:flex;flex-direction:column;gap:9px}
.chk{width:22px;height:22px;border-radius:var(--radius-check);background:var(--primary);display:grid;place-items:center;flex:none}
.chk svg{width:14px;height:14px;color:var(--on-primary)}
.box{width:22px;height:22px;border-radius:var(--radius-check);border:2px solid var(--border-strong);flex:none}
.mini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-strong);font-weight:500}
.mini.done{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--primary-border);text-decoration-thickness:2px}
</style></head><body>
<div class="wrap">
<div class="panel" data-theme="light">
<span class="tag"><span class="d"></span>Light</span>
<div class="helm-progress" style="margin-bottom:12px"><div class="helm-progress__head"><span class="helm-progress__label">Launch readiness</span><span class="helm-progress__value">70%</span></div><div class="helm-progress__track"><div class="helm-progress__fill" style="width:70%"></div></div></div>
<div class="stack">
<div class="mini done"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>Provision Postgres</div>
<div class="mini"><span class="box"></span>Wire up MCP tools</div>
</div>
</div>
<div class="panel" data-theme="dark">
<span class="tag"><span class="d"></span>Dark</span>
<div class="helm-progress" style="margin-bottom:12px"><div class="helm-progress__head"><span class="helm-progress__label">Launch readiness</span><span class="helm-progress__value">70%</span></div><div class="helm-progress__track"><div class="helm-progress__fill" style="width:70%"></div></div></div>
<div class="stack">
<div class="mini done"><span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>Provision Postgres</div>
<div class="mini"><span class="box"></span>Wire up MCP tools</div>
</div>
</div>
</div>
</body></html>
