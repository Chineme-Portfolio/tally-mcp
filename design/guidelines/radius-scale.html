<!-- @dsCard group="Shape" viewport="700x180" name="Corner radius" subtitle="A confident radius — distinct, never timid" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans)}
.row{display:flex;gap:16px;flex-wrap:wrap}
.b{display:flex;flex-direction:column;align-items:center;gap:8px}
.sq{width:66px;height:66px;background:var(--primary-surface);border:2px solid var(--primary-border)}
.t{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-align:center}
.t b{display:block;color:var(--text-strong);font-size:11px}
</style></head><body>
<div class="row">
<div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div><span class="t"><b>sm</b>8</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div><span class="t"><b>md</b>12</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div><span class="t"><b>lg</b>16</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-xl)"></div><span class="t"><b>xl</b>22</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-2xl)"></div><span class="t"><b>2xl</b>28</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-check)"></div><span class="t"><b>check</b>7</span></div>
<div class="b"><div class="sq" style="border-radius:var(--radius-pill)"></div><span class="t"><b>pill</b>999</span></div>
</div>
</body></html>
