<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans)}
.r{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.bar{height:16px;background:var(--primary);border-radius:3px}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:120px}
.lbl b{color:var(--text-strong)}
</style></head><body>
<div class="r"><span class="lbl"><b>space-1</b> · 4</span><span class="bar" style="width:4px"></span></div>
<div class="r"><span class="lbl"><b>space-2</b> · 8</span><span class="bar" style="width:8px"></span></div>
<div class="r"><span class="lbl"><b>space-3</b> · 12</span><span class="bar" style="width:12px"></span></div>
<div class="r"><span class="lbl"><b>space-4</b> · 16</span><span class="bar" style="width:16px"></span></div>
<div class="r"><span class="lbl"><b>space-6</b> · 24</span><span class="bar" style="width:24px"></span></div>
<div class="r"><span class="lbl"><b>space-8</b> · 32</span><span class="bar" style="width:32px"></span></div>
<div class="r"><span class="lbl"><b>space-12</b> · 48</span><span class="bar" style="width:48px"></span></div>
<div class="r"><span class="lbl"><b>space-16</b> · 64</span><span class="bar" style="width:64px"></span></div>
</body></html>
