<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface);padding:20px 22px;font-family:var(--font-display)}
.r{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:6px 0;border-bottom:1px solid var(--border-subtle)}
.r:last-child{border-bottom:none}
.s{color:var(--text-strong);font-weight:600;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap}
</style></head><body>
<div class="r"><span class="s" style="font-size:48px">Ready to ship</span><span class="t">5xl · 48</span></div>
<div class="r"><span class="s" style="font-size:38px">Launch readiness</span><span class="t">4xl · 38</span></div>
<div class="r"><span class="s" style="font-size:30px">Board overview</span><span class="t">3xl · 30</span></div>
<div class="r"><span class="s" style="font-size:24px">Section heading</span><span class="t">2xl · 24</span></div>
<div class="r"><span class="s" style="font-size:20px">Card title</span><span class="t">xl · 20</span></div>
<div class="r"><span class="s" style="font-size:17px;font-family:var(--font-sans)">Emphasis body</span><span class="t">lg · 17</span></div>
<div class="r"><span class="s" style="font-size:14px;font-family:var(--font-sans);font-weight:500">UI body baseline</span><span class="t">base · 14</span></div>
</body></html>
