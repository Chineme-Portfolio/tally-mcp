<!doctype html>

<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
body{margin:0;background:var(--canvas);padding:22px;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.t{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text-strong)}
.d{font-size:12px;color:var(--text-muted);margin-top:3px}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { Card } = window.HelmDesignSystem_94b187;
const Body = ({t,d}) => <><div className="t">{t}</div><div className="d">{d}</div></>;
function App(){
  return (
    <div className="grid">
      <Card><Body t="Default" d="Surface + hairline" /></Card>
      <Card variant="raised"><Body t="Raised" d="Elevated shadow" /></Card>
      <Card variant="outline"><Body t="Outline" d="Quiet, no shadow" /></Card>
      <Card variant="sunken"><Body t="Sunken" d="Inset well" /></Card>
      <Card interactive><Body t="Interactive" d="Hover to lift" /></Card>
      <Card complete><Body t="Complete" d="The done glow" /></Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
