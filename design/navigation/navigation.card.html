<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans);display:flex;flex-direction:column;gap:22px}
.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Tabs } = window.HelmDesignSystem_94b187;
function App(){
  const [a,setA] = React.useState('board');
  const [b,setB] = React.useState('open');
  return (
    <>
      <div><div className="k">Line</div>
        <Tabs value={a} onChange={setA} tabs={[{value:'board',label:'Board'},{value:'activity',label:'Activity'},{value:'settings',label:'Settings'}]} />
      </div>
      <div><div className="k">Pill · segmented</div>
        <Tabs variant="pill" value={b} onChange={setB} tabs={[{value:'all',label:'All',count:10},{value:'open',label:'Open',count:3},{value:'done',label:'Done',count:7}]} />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
