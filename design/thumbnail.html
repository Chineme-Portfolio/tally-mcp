<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0}
.tile{width:1280px;height:854px;display:flex;overflow:hidden;font-family:var(--font-display)}
.main{flex:1;background:var(--copper-600);display:grid;place-items:center}
.name{font-weight:700;font-size:248px;letter-spacing:-.04em;line-height:1;color:#fff}
.name .dot{color:#2e1408}
.strip{width:296px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="name">Helm<span class="dot">.</span></div></div>
  <div class="strip">
    <span style="background:#f59e0b"></span>
    <span style="background:#e08a63"></span>
    <span style="background:#e5484d"></span>
    <span style="background:#3f5b82"></span>
  </div>
</div>
</body>
</html>
