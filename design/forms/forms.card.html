<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface);padding:22px;font-family:var(--font-sans)}
.wrap{display:flex;flex-direction:column;gap:18px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding-top:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Input, Textarea, Select, Checkbox, Radio, Switch } = window.HelmDesignSystem_94b187;
function App(){
  const [a,setA] = React.useState(true);
  const [b,setB] = React.useState(false);
  const [view,setView] = React.useState('all');
  const [on,setOn] = React.useState(true);
  return (
    <div className="wrap">
      <div className="g3">
        <Input label="Board name" defaultValue="Launch readiness" />
        <Input label="Search" iconLeft="search" placeholder="Filter tasks" />
        <Input label="Slug" error="Already taken" defaultValue="launch" />
      </div>
      <div className="g2">
        <Select label="Owner" options={['You','Claude','Unassigned']} />
        <Textarea label="Notes" rows={2} placeholder="Optional detail…" />
      </div>
      <div className="controls">
        <Checkbox label="Provision Postgres" checked={a} onChange={(e)=>setA(e.target.checked)} />
        <Checkbox label="Wire MCP tools" checked={b} onChange={(e)=>setB(e.target.checked)} />
        <Checkbox label="Locked" disabled />
        <Radio name="v" value="all" label="All" checked={view==='all'} onChange={()=>setView('all')} />
        <Radio name="v" value="open" label="Open" checked={view==='open'} onChange={()=>setView('open')} />
        <Switch label="Auto-reorder" checked={on} onChange={(e)=>setOn(e.target.checked)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
